services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loyalty_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/loyalty_saas
      JWT_SECRET: change_me_super_secret
      JWT_EXPIRES_IN: 7d
      APP_BASE_URL: http://localhost:4000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 300
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "Loyalty App <no-reply@loyalty.local>"
      APPLE_WALLET_PASSPHRASE: ""
      APPLE_WALLET_WWDR_PATH: ../wallet/certs/AppleWWDRCAG4.pem
      APPLE_WALLET_SIGNER_CERT_PATH: ../wallet/certs/signerCert.pem
      APPLE_WALLET_SIGNER_KEY_PATH: ../wallet/certs/signerKey.pem
      APPLE_WALLET_PASS_TYPE_IDENTIFIER: pass.com.yourcompany.loyalty
      APPLE_WALLET_TEAM_IDENTIFIER: YOUR_TEAM_IDENTIFIER
      GOOGLE_WALLET_ISSUER_ID: ""
      GOOGLE_WALLET_CLASS_SUFFIX: loyalty_class
    depends_on:
      - db
    ports:
      - "4000:4000"
    volumes:
      - ./wallet:/wallet

  frontend:
    build:
      context: ./frontend-react
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
